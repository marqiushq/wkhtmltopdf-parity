<!DOCTYPE html><html lang="en"><head><title>47-table-borders</title><style>
table.c { border-collapse: collapse } table.c th, table.c td { border: 1pt solid #333; padding: 4pt 8pt } table.s { border-spacing: 6pt; border: 1pt solid black } table.s td { border: 0.5pt solid gray; padding: 3pt }
</style></head><body>
<table class="c"><tr><th>Name</th><th>Qty</th><th>Price</th></tr><tr><td>Widget</td><td>12</td><td>3.50</td></tr><tr><td>Gadget with a longer name</td><td>4</td><td>19.99</td></tr></table><p>Between.</p><table class="s"><tr><td>a</td><td>b</td></tr><tr><td>c</td><td>d</td></tr></table>
</body></html>
