<!DOCTYPE html><html lang="en"><head><title>65-grid-advanced</title><style>
.g { display: grid; grid-template-columns: 80pt 1fr 2fr; gap: 6pt 10pt } .g > div { border: 0.5pt solid black; padding: 3pt } .sp { grid-column: span 2 }
</style></head><body>
<div class="g"><div>cell 1</div><div class=sp>cell 2</div><div>cell 3</div><div>cell 4</div><div>cell 5</div><div>cell 6</div><div>cell 7</div><div>cell 8</div></div>
</body></html>
