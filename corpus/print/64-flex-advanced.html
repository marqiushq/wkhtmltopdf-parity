</style></head><body>
<div class="row"><div class="g1">grow 1</div><div class="g2">grow 2</div><div class="fx">fixed 80pt</div></div><div class="row wrap"><div class="w">item 1</div><div class="w">item 2</div><div class="w">item 3</div><div class="w">item 4</div><div class="w">item 5</div><div class="w">item 6</div><div class="w">item 7</div></div><div class="col"><div>col one</div><div>col two</div></div><div class="row"><div>left</div><div style="margin-left:auto">pushed right</div></div><div class="row mid"><div style="height:40pt">tall</div><div>centered</div></div>
</body></html>
