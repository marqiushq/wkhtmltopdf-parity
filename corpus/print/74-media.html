<!DOCTYPE html><html lang="en"><head><title>74-media</title><style>
@media print { .p { margin-left: 40pt } } @media screen { .s { margin-left: 80pt; font-size: 30pt } } @media (min-width: 300px) { .w { margin-left: 20pt } } @media (max-width: 200px) { .w { margin-left: 90pt } }
</style></head><body>
<p class="p">Print rule applies.</p><p class="s">Screen rule must not apply.</p><p class="w">Width query.</p>
</body></html>
