<!DOCTYPE html><html lang="en"><head><title>69-borders</title><style>
div { margin: 8pt 0; padding: 6pt; width: 200pt } .d { border: 2pt dashed black } .t { border: 2pt dotted black } .db { border: 4pt double black } .r { border: 1pt solid black; border-radius: 8pt; background: #eee } .mix { border-top: 3pt solid red; border-bottom: 1pt solid blue; border-left: 6pt solid #999 }
</style></head><body>
<div class="d">dashed</div><div class="t">dotted</div><div class="db">double</div><div class="r">rounded</div><div class="mix">mixed sides</div>
</body></html>
