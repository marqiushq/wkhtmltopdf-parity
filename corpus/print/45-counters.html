<!DOCTYPE html><html lang="en"><head><title>45-counters</title><style>
body { counter-reset: h1 } h1 { counter-increment: h1; counter-reset: h2 } h2 { counter-increment: h2; counter-reset: h3 } h3 { counter-increment: h3 } h1::before { content: counter(h1, upper-roman) " " } h2::before { content: counter(h1) "." counter(h2) " " } h3::before { content: counter(h1) "." counter(h2) "." counter(h3, lower-alpha) " " } ol.n { counter-reset: item; list-style: none } ol.n > li { counter-increment: item } ol.n > li::before { content: counters(item, ".") " " }
</style></head><body>
<h1>Part</h1><h2>Sub</h2><h2>Sub</h2><h1>Part</h1><h2>Sub</h2><h3>Deep</h3><h3>Deep</h3><ol class=n><li>a<ol class=n><li>aa</li><li>ab</li></ol></li><li>b</li></ol>
</body></html>
