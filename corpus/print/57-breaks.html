<!DOCTYPE html><html lang="en"><head><title>57-breaks</title><style>
@page { size: A5; margin: 40pt } .pb { break-before: page } .keep { break-inside: avoid }
</style></head><body>
<p>First page.</p><h2 class="pb">Forced break before</h2><p>Second page text.</p><div class="keep"><p>Keep together one.</p><p>Keep together two.</p></div><p style="page-break-after:always">Break after this.</p><p>Final page.</p>
</body></html>
