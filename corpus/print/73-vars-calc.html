:root { --pad: 12pt; --size: 15pt } .a { width: calc(100% - 100pt); border: 0.5pt solid black } .b { padding-left: var(--pad); font-size: var(--size); margin-top: calc(var(--pad) * 2) } .c { margin-left: var(--missing, 40pt) }
</style></head><body>

</body></html>
