<!DOCTYPE html><html lang="en"><head><title>50-inline-block</title><style>
.b { display: inline-block; border: 0.5pt solid black; padding: 2pt 5pt } .tag { display: inline-block; background: #ddd; padding: 1pt 4pt; margin-right: 4pt }
</style></head><body>
<p>Text with <span class="b">an inline block</span> and <span class="b" style="width:80pt">a fixed-width one</span> in the middle of a line that keeps going for a while so that it wraps onto another line.</p><p><span class="tag">tag</span> <span class="tag">second</span> <span class="tag">third tag</span></p>
</body></html>
