<!DOCTYPE html><html lang="en"><head><title>52-sizing</title><style>
.w { width: 200pt; margin: 0 auto; border: 0.5pt solid black } .mx { max-width: 250pt; border: 0.5pt solid black; margin: 8pt 0 } .bb { box-sizing: border-box; width: 200pt; padding: 10pt; border: 5pt solid gray } .h { height: 60pt; border: 0.5pt solid black; margin-top: 8pt }
</style></head><body>
<div class="w">Fixed width 200pt centred with auto margins.</div><div class="mx">Max-width 250pt: The quick brown fox jumps over the lazy dog while the pack reorganizes its strategy for the winter season ahead of schedule. </div><div class="bb">Border-box 200pt</div><div class="h">Height 60pt</div><p>After.</p>
</body></html>
