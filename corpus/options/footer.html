<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script>
function subst() {
  var vars = {};
  var query = window.location.search.substring(1).split('&');
  for (var i = 0; i < query.length; i++) {
    var pair = query[i].split('=', 2);
    vars[pair[0]] = decodeURIComponent(pair[1]);
  }
  var names = ['page', 'topage', 'section'];
  for (var n = 0; n < names.length; n++) {
    var els = document.getElementsByClassName(names[n]);
    for (var j = 0; j < els.length; j++) els[j].textContent = vars[names[n]];
  }
}
</script>
<style>
body { font-family: Arial, sans-serif; font-size: 9px; color: #555; margin: 0 }
table { width: 100%; border-top: 1px solid #bbb }
td.c { text-align: center } td.r { text-align: right }
</style></head>
<body onload="subst()"><table><tr><td>Internal: not for circulation</td><td class="c"><span class="section"></span></td><td class="r">Page <span class="page"></span> of <span class="topage"></span></td></tr></table></body></html>
