<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Odoo's image has the URW clones (Nimbus) and Chrome's package brings Liberation. Qt asks for
     Helvetica, Times and Courier, Chrome for Arial, Times New Roman and Courier New: with the URW
     clones hidden, both programs land on the same Liberation fonts. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Nimbus Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Nimbus Sans Narrow</string></patelt></pattern>
      <pattern><patelt name="family"><string>Nimbus Roman</string></patelt></pattern>
      <pattern><patelt name="family"><string>Nimbus Mono PS</string></patelt></pattern>
      <pattern><patelt name="family"><string>Nimbus Sans L</string></patelt></pattern>
      <pattern><patelt name="family"><string>Nimbus Roman No9 L</string></patelt></pattern>
      <pattern><patelt name="family"><string>Nimbus Mono L</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
